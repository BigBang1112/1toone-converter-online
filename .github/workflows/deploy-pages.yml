# Simple workflow for deploying static content to GitHub Pages
name: Deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  deploy:
  
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
    
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
          
      - name: Publish
        run: dotnet publish 1toOneConverterOnline -c Release --nologo -o publish /p:ContinuousIntegrationBuild=true
        
      - name: Test
        run: dotnet test --no-build --verbosity normal
        
      - name: Change base in index.html to repository name
        run: sed -i 's/<base href="\/" \/>/<base href="\/1toone-converter-online\/" \/>/g' publish/wwwroot/index.html
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot/.
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
