name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore 1toOneConverterOnline.slnx
      
    - name: Build
      run: dotnet build 1toOneConverterOnline.slnx --no-restore /p:ContinuousIntegrationBuild=true
      
    - name: Test
      run: dotnet test 1toOneConverterOnline.slnx --no-build --verbosity normal
